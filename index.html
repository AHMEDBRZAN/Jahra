<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مجمع الجوهره السكني — الصرفيات والسلف</title>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--p9:#0b2e24;--p8:#0e3b2e;--g6:#147a54;--r6:#b2472f;--go:#e0a63c;--go6:#c98f26;--go1:#f6efdc;--pap:#eef1ea;--lin:#dde4d9;--ink:#1e2b26;--mut:#6b7a72;--rout:#fbeceb;--wout:#fff7e0}
*{margin:0;padding:0;box-sizing:border-box}html{touch-action:manipulation}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--pap);color:var(--ink);min-height:100vh}
body.locked{overflow:hidden}button,input,select{font:inherit}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.97)}}
@keyframes prog{from{width:100%}to{width:0}}
.emb{width:46px;height:46px;display:block}
header{background:linear-gradient(135deg,var(--p9),var(--p8));color:#fff;border-bottom:3px solid var(--go);padding:14px 16px}
.h-in{max-width:760px;margin:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.h-t h1{font-family:'Changa';font-size:19px;font-weight:800;color:#f3e3bd}
.h-t small{color:#bcd3c5;font-size:11px;display:block}
.h-x{margin-inline-start:auto;display:flex;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:rgba(255,255,255,.2)}
.wrap{max-width:760px;margin:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--lin);border-radius:16px;padding:14px;text-align:center;animation:rise .4s both;border-top:3px solid var(--go)}
.stat.r{border-top-color:var(--r6)}.stat.g{border-top-color:var(--g6)}
.stat .v{font-family:'Changa';font-weight:800;font-size:20px;direction:ltr}
.stat.r .v{color:var(--r6)}.stat.g .v{color:var(--g6)}.stat.y .v{color:var(--go6)}
.stat .l{font-size:11.5px;color:var(--mut);font-weight:700;margin-top:2px}
.bar{background:#fff;border:1px solid var(--lin);border-radius:16px;padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:#f0f3ec;border:1px solid var(--lin);border-radius:12px;padding:3px;gap:3px;flex:1;min-width:200px}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);padding:9px 4px;border-radius:9px;font-weight:800;font-size:12px;cursor:pointer}
.seg button.on{background:linear-gradient(135deg,var(--g6),#2fae7d);color:#fff}
.srch{flex:1;min-width:160px;position:relative}
.srch input{width:100%;padding:10px 34px 10px 12px;border:1.5px solid var(--lin);border-radius:12px;font-size:13px;background:#fff}
.srch input:focus{outline:none;border-color:var(--g6)}
.srch svg{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);color:var(--mut)}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:#fff;border:1px solid var(--lin);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;animation:rise .3s both;border-inline-start:4px solid var(--go)}
.row.site{border-inline-start-color:var(--r6)}
.row .dt{background:#f4f6ef;border:1px solid var(--lin);border-radius:10px;padding:6px 8px;font-size:11px;font-weight:700;color:var(--mut);direction:ltr;white-space:nowrap}
.row .mid{flex:1;min-width:0}
.row .nm{font-weight:800;font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px}
.badge.site{background:var(--rout);color:var(--r6)}
.badge.salaf{background:var(--wout);color:var(--go6)}
.row .de{font-size:12px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .am{font-family:'Changa';font-weight:800;font-size:16px;direction:ltr;white-space:nowrap}
.row.site .am{color:var(--r6)}.row.salaf .am{color:var(--go6)}
.row .ac{display:flex;gap:4px}
.mini{width:32px;height:32px;border-radius:9px;border:1px solid var(--lin);background:#fff;cursor:pointer;font-size:14px}
.mini:hover{background:#f4f6ef}
.empty{background:#fff;border:1px dashed var(--lin);border-radius:16px;padding:40px;text-align:center;color:var(--mut)}
.empty .ei{font-size:40px;margin-bottom:8px}
#fab{position:fixed;inset-inline-end:18px;bottom:18px;width:60px;height:60px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--go),var(--go6));color:#201404;font-size:34px;font-weight:800;line-height:1;box-shadow:0 10px 26px rgba(201,143,38,.5);cursor:pointer;z-index:40}
#fab:active{transform:scale(.94)}
.ov{position:fixed;inset:0;background:rgba(7,22,16,.6);display:none;z-index:50;padding:14px;overflow:auto}
.ov.show{display:flex}
.modal{margin:auto;width:min(460px,100%);background:#fff;border-radius:20px;overflow:hidden;animation:pop .3s;border:1px solid #e6d9b8}
.m-head{padding:14px 16px;color:#fff;font-family:'Changa';font-size:16px;font-weight:800;background:linear-gradient(135deg,var(--p8),#12503e);display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--go)}
.m-x{background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer}
.m-body{padding:16px;display:grid;gap:12px}
.logo-c{display:flex;align-items:center;gap:10px;justify-content:center;font-family:'Changa';font-weight:800;font-size:16px;color:var(--go6)}
.logo-c .emb{width:42px;height:42px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:5px}
.field input,.field select{width:100%;padding:12px;border:1.5px solid var(--lin);border-radius:12px;font-size:15px;background:#fbfcf9}
.field input:focus,.field select:focus{outline:none;border-color:var(--g6);background:#fff}
.btn-save{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--go6),var(--go));color:#201404;font-family:'Changa';font-size:17px;font-weight:800;cursor:pointer}
.m-foot{display:flex;gap:10px;justify-content:flex-end;padding:0 16px 16px}
.btn-c{background:#fff;border:1px solid var(--lin);padding:11px 20px;border-radius:11px;cursor:pointer;font-weight:600;color:var(--mut)}
.btn-d{background:linear-gradient(135deg,#7e2d1c,var(--r6));color:#fff;border:none;padding:11px 22px;border-radius:11px;font-weight:700;cursor:pointer}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);background:var(--p9);color:#fff;padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 14px 34px rgba(0,0,0,.28);border-inline-start:4px solid var(--go);z-index:99;transition:.35s;max-width:90vw;opacity:0}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast .prog{position:absolute;bottom:0;left:0;height:3px;background:var(--go);width:0}
.toast.show .prog{animation:prog linear forwards}
@media print{header,.bar,#fab,.toast,.row .ac,.h-x{display:none!important}.row{border:1px solid #bbb;break-inside:avoid}}
@media(max-width:560px){.stats{grid-template-columns:1fr}.row{flex-wrap:wrap}.row .am{width:100%;text-align:left}.field input,.field select{font-size:16px}}
</style>
</head>
<body>
<svg style="display:none"><defs><linearGradient id="eg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8c06a"/><stop offset="1" stop-color="#c98f26"/></linearGradient></defs>
<symbol id="emb" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="none" stroke="url(#eg)" stroke-width="2.5"/><path fill="url(#eg)" d="M15 33V21l5-5 5 5v12h-3v-8h-4v8zM27 33V15l5-4 5 4v18h-3v-11h-4v11z"/><rect x="12" y="33" width="24" height="2.5" rx="1.2" fill="url(#eg)"/></symbol></svg>
<header><div class="h-in">
<svg class="emb"><use href="#emb"/></svg>
<div class="h-t"><h1>مجمع الجوهره السكني</h1><small>نظام الصرفيات والسلف</small></div>
<div class="h-x">
<button class="iconbtn" id="csvBtn" title="تصدير CSV">⬇</button>
<button class="iconbtn" id="printBtn" title="طباعة">🖨</button>
</div>
</div></header>
<main class="wrap">
<section class="stats">
<div class="stat r"><div class="v" id="sSite">0</div><div class="l">صرفيات الموقع</div></div>
<div class="stat y"><div class="v" id="sSalaf">0</div><div class="l">السلف</div></div>
<div class="stat g"><div class="v" id="sAll">0</div><div class="l">الإجمالي · <span id="sCnt">0</span> حركة</div></div>
</section>
<section class="bar">
<div class="seg">
<button data-f="all" class="on">الكل</button>
<button data-f="site">صرفيات الموقع</button>
<button data-f="salaf">السلف</button>
</div>
<div class="srch">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2"/></svg>
<input id="q" type="search" placeholder="بحث بالاسم أو التفاصيل…">
</div>
</section>
<section class="list" id="list"></section>
<button id="fab" title="إضافة">+</button>
</main>
<div class="ov" id="addOv"><div class="modal">
<div class="m-head"><span id="addTitle">➕ إضافة جديدة</span><button class="m-x" id="addX">✕</button></div>
<div class="m-body">
<div class="logo-c"><svg class="emb"><use href="#emb"/></svg><b>مجمع الجوهره السكني</b></div>
<div class="field"><label>النوع</label><select id="fType"><option value="site">صرفيات الموقع</option><option value="salaf">سلفة</option></select></div>
<div class="field"><label>اسم المستلم</label><input id="fName" placeholder="اسم المستلم…"></div>
<div class="field"><label>التفاصيل</label><input id="fDet" placeholder="التفاصيل…"></div>
<div class="field"><label>المبلغ (د.ع.)</label><input id="fAmt" type="number" min="0" placeholder="0"></div>
<div class="field"><label>التاريخ</label><input id="fDate" type="date"></div>
<button class="btn-save" id="fSave">💾 حفظ</button>
</div>
</div></div>
<div class="ov" id="cfOv"><div class="modal" style="width:min(400px,100%)">
<div class="m-head" style="background:linear-gradient(135deg,#7e2d1c,var(--r6))"><span>⚠️ تأكيد الحذف</span><button class="m-x" id="cfX">✕</button></div>
<div class="m-body"><p id="cfMsg" style="font-size:14px;line-height:1.9"></p></div>
<div class="m-foot"><button class="btn-c" id="cfNo">إلغاء</button><button class="btn-d" id="cfYes">نعم، احذف</button></div>
</div></div>
<div class="toast" id="toast"><span id="toastMsg"></span><div class="prog"></div></div>
<script>
var KEY='jawhara_v1';
var TX=JSON.parse(localStorage.getItem(KEY)||'[]');
var filter='all',q='',editId=null,cfCb=null,toastTimer=null;
function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
var TODAY=dstr(new Date());
function fmtD(iso){if(!iso)return '—';var p=iso.split('-');return p[2]+'-'+p[1]+'-'+p[0]}
function money(n){return (Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:2})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function save(){localStorage.setItem(KEY,JSON.stringify(TX))}
function showOv(el){el.classList.add('show');document.body.classList.add('locked')}
function hideOv(el){el.classList.remove('show');if(!document.querySelector('.ov.show'))document.body.classList.remove('locked')}
function showToast(msg,dur){dur=dur||2200;var t=$('#toast');$('#toastMsg').textContent=msg;t.querySelector('.prog').style.animationDuration=dur+'ms';t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show')},dur)}
function sum(t){return TX.filter(function(r){return r.type===t}).reduce(function(s,r){return s+(+r.amount||0)},0)}
function render(){
$('#sSite').textContent=money(sum('site'));
$('#sSalaf').textContent=money(sum('salaf'));
$('#sAll').textContent=money(sum('site')+sum('salaf'));
$('#sCnt').textContent=TX.length;
var rows=TX.filter(function(r){return (filter==='all'||r.type===filter)}).filter(function(r){if(!q)return true;var s=(r.name+' '+r.details).toLowerCase();return s.indexOf(q)>=0});
rows.sort(function(a,b){return (b.date||'').localeCompare(a.date||'')||(b.id-a.id)});
$('#list').innerHTML=rows.length?rows.map(function(r){return '<div class="row '+r.type+'">'+
'<span class="dt">'+fmtD(r.date)+'</span>'+
'<span class="mid"><span class="nm">'+esc(r.name)+' <span class="badge '+r.type+'">'+(r.type==='site'?'صرفيات الموقع':'سلفة')+'</span></span>'+
'<span class="de">'+esc(r.details||'—')+'</span></span>'+
'<span class="am">'+money(r.amount)+'</span>'+
'<span class="ac"><button class="mini" data-e="'+r.id+'" title="تعديل">✏️</button><button class="mini" data-d="'+r.id+'" title="حذف">🗑</button></span></div>'}).join(''):
'<div class="empty"><div class="ei">🗂️</div><p>لا توجد حركات — اضغط + للإضافة</p></div>'}
$$('.seg button').forEach(function(b){b.onclick=function(){$$('.seg button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');filter=b.dataset.f;render()}});
$('#q').oninput=function(){q=this.value.trim().toLowerCase();render()};
function openAdd(){editId=null;$('#addTitle').textContent='➕ إضافة جديدة';$('#fType').value='site';$('#fName').value='';$('#fDet').value='';$('#fAmt').value='';$('#fDate').value=TODAY;showOv($('#addOv'));setTimeout(function(){$('#fName').focus()},150)}
function openEdit(id){var r=TX.find(function(x){return x.id==id});if(!r)return;editId=id;$('#addTitle').textContent='✏️ تعديل حركة';$('#fType').value=r.type;$('#fName').value=r.name;$('#fDet').value=r.details;$('#fAmt').value=r.amount;$('#fDate').value=r.date;showOv($('#addOv'))}
$('#fab').onclick=openAdd;
$('#addX').onclick=function(){hideOv($('#addOv'))};
$('#fSave').onclick=function(){
var nm=$('#fName').value.trim(),am=parseFloat($('#fAmt').value);
if(!nm){showToast('أدخل اسم المستلم',2000);return}
if(isNaN(am)||am<=0){showToast('أدخل مبلغًا صحيحًا',2000);return}
var rec={type:$('#fType').value,name:nm,details:$('#fDet').value.trim(),amount:am,date:$('#fDate').value||TODAY};
if(editId){var i=TX.findIndex(function(x){return x.id==editId});rec.id=editId;TX[i]=rec;showToast('✅ تم التعديل')}
else{rec.id=Date.now();TX.push(rec);showToast('✅ تمت الإضافة: '+nm+' — '+money(am)+' د.ع.')}
save();render();hideOv($('#addOv'))};
$('#list').addEventListener('click',function(e){
var ed=e.target.closest('[data-e]');if(ed){openEdit(ed.dataset.e);return}
var dl=e.target.closest('[data-d]');if(dl){var id=dl.dataset.d;var r=TX.find(function(x){return x.id==id});
$('#cfMsg').textContent='حذف حركة «'+(r?r.name:'')» بمبلغ '+money(r?r.amount:0)+' د.ع. نهائيًا؟';
cfCb=function(){TX=TX.filter(function(x){return x.id!=id});save();render();showToast('🗑 تم الحذف')};
showOv($('#cfOv'))}});
$('#cfYes').onclick=function(){hideOv($('#cfOv'));if(cfCb)cfCb();cfCb=null};
$('#cfNo').onclick=$('#cfX').onclick=function(){hideOv($('#cfOv'));cfCb=null};
document.addEventListener('keydown',function(e){if(e.key==='Escape'){hideOv($('#addOv'));hideOv($('#cfOv'))}});
$('#csvBtn').onclick=function(){if(!TX.length){showToast('لا بيانات للتصدير',2000);return}
var csv='\uFEFFالتاريخ,النوع,اسم المستلم,التفاصيل,المبلغ (د.ع.)\n';
TX.forEach(function(r){csv+=[fmtD(r.date),r.type==='site'?'صرفيات الموقع':'سلفة',r.name,r.details,r.amount].map(function(x){return '"'+String(x==null?'':x).replace(/"/g,'""')+'"'}).join(',')+'\n'});
var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='الجوهره-الصرفيات-والسلف.csv';a.click();showToast('تم التصدير ✓')};
$('#printBtn').onclick=function(){window.print()};
render();
</script>
</body>
</html>
